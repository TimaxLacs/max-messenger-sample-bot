[project]
name = "may9-orchestrator"
version = "0.1.0"
description = "HTTP-orchestrator: quota + May 9 image processing for MAX bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pillow>=11.0",
  "python-multipart>=0.0.17",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
